# main ブランチに push すると、ブラウザ版(Blazor WebAssembly)をビルドして GitHub Pages に公開する。
# 事前に GitHub のリポジトリ設定で Settings → Pages → Source を「GitHub Actions」にしておくこと。
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions 画面から手動でも実行できる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: テスト
        run: dotnet test -c Release

      - name: ブラウザ版をビルド
        run: dotnet publish src/Mahjong.Web -c Release -o publish

      - name: GitHub Pages 用に調整
        run: |
          cd publish/wwwroot
          # https://ユーザー名.github.io/リポジトリ名/ で動くように基準パスを変える
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' index.html
          # URL を直接開いたときも index.html を返すようにする
          cp index.html 404.html
          # _framework フォルダを GitHub Pages(Jekyll)に無視させない
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
